<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rivières du Grand Est</title>
<style>
/* Un élément masqué reste masqué, même si une règle lui donne un « display » */
[hidden] { display: none !important; }
/* Carte plein écran sur fond sombre : la région se détache par un halo blanc vers
   l'extérieur ; les rivières sont dessinées sur un canevas, le reste en SVG.
   Un seul thème, sombre, par choix (d'après la référence fournie). */
:root {
  color-scheme: dark;
  --bg: #2e2f34;          /* hors région */
  --land: #27282c;        /* intérieur de la région */
  --border: #5c5d65;      /* limites départementales */
  --river-1: #3b6894;     /* petits cours d'eau */
  --river-2: #4f8ec4;
  --river-3: #6fb3e8;     /* grandes rivières */
  --label: #ececec;
  --muted: #8a8b93;
  --font: "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
}
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: var(--bg); color: var(--label); font: 400 13px/1.4 var(--font); }
.layer { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#front { cursor: default; }
.dept { fill: transparent; stroke: var(--border); stroke-width: .8; stroke-dasharray: 2 3; transition: fill .25s, stroke .25s; }
.dept.dim { fill: rgba(22, 23, 27, .62); }
.dept.on { stroke: #fff; stroke-width: 1.6; stroke-dasharray: none; filter: url(#soft-glow); }
.dept-name { font-size: 15px; letter-spacing: .32em; text-transform: uppercase; fill: var(--muted); fill-opacity: .55;
  text-anchor: middle; pointer-events: none; transition: fill-opacity .25s, fill .25s; }
.dept-name.on { fill: #fff; fill-opacity: .95; }
.dept-name.off { fill-opacity: 0; }
.river-name { font-size: 10.5px; font-style: italic; fill: var(--river-3); fill-opacity: .9; pointer-events: none;
  paint-order: stroke; stroke: var(--land); stroke-width: 3px; stroke-opacity: .7; letter-spacing: .02em; }
.city-dot { fill: #c9c9c9; stroke: #1e1f23; stroke-width: 1; pointer-events: none; }
.city { font-size: 12px; font-weight: 600; fill: var(--label); pointer-events: none; paint-order: stroke; stroke: #1e1f23; stroke-width: 3px; stroke-opacity: .55; }
.city.big { font-size: 13px; }
.credit { position: absolute; left: max(16px, env(safe-area-inset-left)); bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  font-size: 11px; color: var(--muted); letter-spacing: .02em; pointer-events: none; }
.credit b { color: var(--label); font-weight: 600; letter-spacing: .14em; text-transform: uppercase; font-size: 12px; display: block; margin-bottom: 2px; }
@media (prefers-reduced-motion: reduce) { .dept, .dept-name { transition: none; } }
</style>

<svg class="layer" id="back" aria-hidden="true"></svg>
<canvas class="layer" id="rivers" aria-hidden="true"></canvas>
<svg class="layer" id="front" role="img" aria-label="Carte des cours d'eau du Grand Est. Survolez un département pour le mettre en avant."></svg>
<div class="credit"><b>Cours d'eau du Grand Est</b>8 929 cours d'eau · BD TOPAGE (Sandre / IGN)</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const DATA = /*__DATA__*/null;

const css = getComputedStyle(document.documentElement);
const tok = k => css.getPropertyValue("--" + k).trim();
// [lon, lat] (ordre GeoJSON)
const decode = arr => {
  const out = []; let x = 0, y = 0;
  for (let i = 0; i < arr.length; i += 2) { x += arr[i]; y += arr[i + 1]; out.push([x / DATA.q, y / DATA.q]); }
  return out;
};
// Anneaux de polygone remis dans le sens attendu par d3 (sinon d3 remplit le monde entier)
const polygon = rings => {
  const feature = { type: "Feature", geometry: { type: "MultiPolygon", coordinates: rings.map(r => [r]) } };
  feature.geometry.coordinates.forEach(p => { if (d3.geoArea({ type: "Polygon", coordinates: p }) > 2 * Math.PI) p[0].reverse(); });
  return feature;
};

const region = polygon(DATA.region.map(decode));
const depts = DATA.depts.map(d => ({ ...polygon(d.g.map(decode)), nom: d.nom }));
const rivers = DATA.rivers.map(r => ({ ...r, parts: r.g.map(decode) }));
const maxAt = Math.max(...rivers.filter(r => r.rp).map(r => r.at));

const back = d3.select("#back"), front = d3.select("#front"), canvas = document.getElementById("rivers");
let projection, path;

function draw() {
  const w = innerWidth, h = innerHeight, pad = Math.min(w, h) * 0.06;
  projection = d3.geoConicConformal().parallels([47, 50]).rotate([-5.5, 0]).fitExtent([[pad, pad], [w - pad, h - pad]], region);
  path = d3.geoPath(projection);
  drawBack(w, h);
  drawRivers(w, h);
  drawFront();
}

// ---------- Fond : halo blanc vers l'extérieur, puis la région ----------
function drawBack(w, h) {
  back.selectAll("*").remove();
  const defs = back.append("defs");
  const blur = Math.max(6, Math.min(w, h) / 90);
  defs.append("filter").attr("id", "halo").attr("x", "-20%").attr("y", "-20%").attr("width", "140%").attr("height", "140%")
    .append("feGaussianBlur").attr("stdDeviation", blur);
  // Le halo n'est visible qu'en dehors de la région
  const mask = defs.append("mask").attr("id", "outside");
  mask.append("rect").attr("width", w).attr("height", h).attr("fill", "#fff");
  mask.append("path").attr("d", path(region)).attr("fill", "#000");
  back.append("rect").attr("width", w).attr("height", h).attr("fill", tok("bg"));
  back.append("g").attr("mask", "url(#outside)")
    .append("path").attr("d", path(region)).attr("fill", "none").attr("stroke", "#fff").attr("stroke-width", blur * 1.4)
    .attr("stroke-opacity", .55).attr("filter", "url(#halo)");
  back.append("path").attr("d", path(region)).attr("fill", tok("land"));
}

// ---------- Rivières (canevas) ----------
function drawRivers(w, h) {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = w * dpr; canvas.height = h * dpr;
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  const scale = Math.min(w, h) / 900;
  const color = d3.scaleLinear().domain([0.4, 1.4, 4]).range([tok("river-1"), tok("river-2"), tok("river-3")]).clamp(true);
  const geo = d3.geoPath(projection, ctx);
  for (const r of rivers) {
    if (!r.rp) {
      // Petits cours d'eau : trait fin, constant
      const lw = (r.k >= 10 ? 0.75 : 0.45) * scale;
      ctx.strokeStyle = color(lw / scale); ctx.globalAlpha = r.k >= 10 ? 0.85 : 0.6; ctx.lineWidth = lw;
      ctx.beginPath(); geo({ type: "MultiLineString", coordinates: r.parts }); ctx.stroke();
      continue;
    }
    // Grandes rivières : largeur croissante de la source à l'embouchure (comme Leaflet.River)
    const minW = 0.7, maxW = 1.2 + 3.6 * Math.sqrt(r.at / maxAt);
    ctx.globalAlpha = 1;
    r.parts.forEach((part, j) => {
      const [p0, p1] = r.rp[j];
      const pts = part.map(p => projection(p));
      const seg = [0];
      for (let i = 1; i < pts.length; i++) seg.push(seg[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
      const total = seg[seg.length - 1] || 1;
      for (let i = 1; i < pts.length; i++) {
        const f = p0 + (p1 - p0) * (seg[i] / total);
        const lw = minW + (maxW - minW) * f;
        ctx.lineWidth = lw * scale; ctx.strokeStyle = color(lw);
        ctx.beginPath(); ctx.moveTo(pts[i - 1][0], pts[i - 1][1]); ctx.lineTo(pts[i][0], pts[i][1]); ctx.stroke();
      }
    });
  }
  ctx.globalAlpha = 1;
}

// ---------- Avant-plan : départements survolables, noms, villes ----------
function drawFront() {
  front.selectAll("*").remove();
  const defs = front.append("defs");
  const glow = defs.append("filter").attr("id", "soft-glow").attr("x", "-10%").attr("y", "-10%").attr("width", "120%").attr("height", "120%");
  glow.append("feGaussianBlur").attr("in", "SourceGraphic").attr("stdDeviation", 2.2).attr("result", "b");
  const merge = glow.append("feMerge");
  merge.append("feMergeNode").attr("in", "b"); merge.append("feMergeNode").attr("in", "SourceGraphic");

  const g = front.append("g");
  const shapes = g.selectAll(".dept").data(depts).join("path").attr("class", "dept").attr("d", path);
  const names = front.append("g").selectAll(".dept-name").data(depts).join("text").attr("class", "dept-name")
    .attr("transform", d => { const c = path.centroid(d); return `translate(${c[0]},${c[1]})`; })
    .text(d => d.nom);

  // Noms des grandes rivières, le long de leur cours
  const lg = front.append("g");
  DATA.labels.forEach((l, i) => {
    let pts = decode(l.g).map(p => projection(p));
    if (pts.length < 2) return;
    if (pts[0][0] > pts[pts.length - 1][0]) pts = pts.reverse();   // texte toujours lisible de gauche à droite
    const id = "rl" + i;
    defs.append("path").attr("id", id).attr("d", d3.line().curve(d3.curveBasis)(pts));
    lg.append("text").attr("class", "river-name").attr("dy", -4)
      .append("textPath").attr("href", "#" + id).attr("startOffset", "50%").attr("text-anchor", "middle")
      .text(l.n.charAt(0).toUpperCase() + l.n.slice(1));
  });

  // Villes, avec placement simple de l'étiquette pour éviter les chevauchements
  const placed = [];
  const cg = front.append("g");
  DATA.cities.forEach(c => {
    const [x, y] = projection([c.lon, c.lat]);
    const big = c.r < 5, fs = big ? 13 : 12, tw = c.n.length * fs * 0.56, th = fs;
    cg.append("circle").attr("class", "city-dot").attr("cx", x).attr("cy", y).attr("r", big ? 3.6 : 2.8);
    const options = [[7, 4, "start"], [-7, 4, "end"], [0, -8, "middle"], [0, 15, "middle"]];
    const box = ([dx, dy, a]) => {
      const x0 = a === "start" ? x + dx : a === "end" ? x + dx - tw : x - tw / 2;
      return [x0, y + dy - th, x0 + tw, y + dy + 2];
    };
    const hit = b => placed.some(o => b[0] < o[2] && b[2] > o[0] && b[1] < o[3] && b[3] > o[1]);
    const choice = options.find(o => !hit(box(o))) || options[0];
    placed.push(box(choice), [x - 4, y - 4, x + 4, y + 4]);
    cg.append("text").attr("class", "city" + (big ? " big" : "")).attr("x", x + choice[0]).attr("y", y + choice[1])
      .attr("text-anchor", choice[2]).text(c.n);
  });

  // Survol : les autres départements s'assombrissent, celui-ci prend un contour blanc
  const focus = d => {
    shapes.classed("dim", o => d && o !== d).classed("on", o => o === d);
    names.classed("on", o => o === d).classed("off", o => d && o !== d);
    if (d) shapes.filter(o => o === d).raise();
  };
  shapes.on("mouseenter", (e, d) => focus(d)).on("click", (e, d) => focus(d));   // le clic sert aux écrans tactiles
  g.on("mouseleave", () => focus(null));
}

let resizeTimer;
addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(draw, 150); });
draw();
</script>
